[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msrtv"
version = "0.1.0"
description = "Multi-Scale Roto-Translational Total Variation Flow."
authors = [{ name = "Finn Sherry" }]
requires-python = ">=3.10"
dependencies = ["torch", "scipy", "tqdm"]

[tool.setuptools.packages.find]
include = ["msrtv*"]
